<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組合ニュース変更</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", "Yu Gothic", sans-serif;
            color: #222;
        }

        .page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            font-size: 16px;
            margin-bottom: 22px;
        }

        input[type="text"] {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .required {
            color: #d00;
            font-size: 13px;
        }

        .notice {
            background: #fff8e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error {
            background: #fff0f0;
            color: #b00000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 15px;
            font-size: 17px;
            font-weight: 700;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="page">

    <h1>📰 組合ニュースを変更</h1>

    <div class="card">

        <div class="notice">
            変更するときは、新しいPDFを必ず選択してください。
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label>
                題名 <span class="required">必須</span>
            </label>

            <input
                type="text"
                name="title"
                value="{{ news.title }}"
                required
            >

            <label>
                内容 <span style="font-size: 13px; color: #777;">任意</span>
            </label>

            <textarea
                name="content"
                rows="5"
                placeholder="組合ニュースの内容を入力してください。空欄でも登録できます。"
                style="width:100%; box-sizing:border-box; padding:12px; margin-bottom:20px; font-size:16px;"
            >{{ news.content }}</textarea>

            <label>
                新しいPDF <span class="required">必須</span>
            </label>

            <input
                type="file"
                name="pdf_file"
                accept="application/pdf,.pdf"
                required
            >

            <button type="submit">
                この内容に変更
            </button>

        </form>

    </div>

    <a class="back" href="{% url 'admin_union_news' %}">
        ← 組合ニュース管理へ戻る
    </a>

</div>

</body>
</html>
