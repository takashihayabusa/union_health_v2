<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全組合員への配信確認</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f9ff;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", "Yu Gothic", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 28px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
            color: #d32f2f;
        }

        .target {
            margin: 25px 0;
            padding: 20px;
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .item {
            margin-top: 20px;
        }

        .label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .value {
            background: #f8fbff;
            border: 1px solid #dbe9ff;
            border-radius: 10px;
            padding: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .warning {
            margin-top: 25px;
            padding: 18px;
            background: #ffebee;
            border-radius: 10px;
            color: #b71c1c;
            line-height: 1.7;
            text-align: center;
            font-weight: bold;
        }

        .send-button {
            width: 100%;
            margin-top: 25px;
            padding: 17px;
            border: 0;
            border-radius: 10px;
            background: #d32f2f;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            background: #777;
            color: white;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚠️ 全組合員への配信確認</h1>

    <div class="target">
        配信対象：{{ target_count }}名
    </div>

    <div class="item">
        <div class="label">タイトル</div>
        <div class="value">{{ title }}</div>
    </div>

    <div class="item">
        <div class="label">本文</div>
        <div class="value">{{ content }}</div>
    </div>

    <div class="item">
        <div class="label">添付PDF</div>
        <div class="value">
            {% if has_pdf == "yes" %}
                あり{% if pdf_name %}：{{ pdf_name }}{% endif %}
            {% else %}
                なし
            {% endif %}
        </div>
    </div>

    <div class="warning">
        このボタンを押すと、対象となる全組合員へLINEが配信されます。<br>
        内容をもう一度確認してください。
    </div>

    <form action="{% url 'broadcast_all_send' %}" method="post">
        {% csrf_token %}

        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="content" value="{{ content }}">
        <input type="hidden" name="has_pdf" value="{{ has_pdf }}">

        <button type="submit" class="send-button">
            本当に全組合員へ配信する
        </button>
    </form>

    <a href="{% url 'broadcast_send' %}" class="back-button">
        配信をやめて入力画面に戻る
    </a>

</div>

</body>
</html>
