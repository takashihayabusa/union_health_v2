<!DOCTYPE html>
<html lang="ja">
<head>

    <title>組合相談</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f7f8;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                         "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 18px;
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
        }

        .consult-btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px 12px;
            margin-bottom: 14px;
            background: white;
            font-size: 19px;
            font-weight: bold;
            text-align: center;
            color: #222;
            text-decoration: none;
            cursor: pointer;
        }

        .detail {
            display: none;
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin: -4px 0 16px;
            text-align: center;
        }

        .phone-number {
            display: block;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
            margin-top: 12px;
        }

        .qr {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-top: 12px;
        }
    </style>
</head>
