<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont,
            "Helvetica Neue", Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
            background: white;
            padding: 28px 22px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin: 0 0 28px;
        }

        form p {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 56px;
            padding: 10px 14px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 20px;
        }

        input:focus {
            outline: 2px solid #333;
        }

        button {
            width: 100%;
            height: 58px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .errorlist {
            color: #c62828;
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>ログイン</h2>

    <form method="post">
        {% csrf_token %}

        <input type="hidden"
            name="next"
            value="{{ request.GET.next }}">

        {{ form.as_p }}

        <button type="submit">
            ログイン
        </button>
    </form>

</div>

</body>
</html>
