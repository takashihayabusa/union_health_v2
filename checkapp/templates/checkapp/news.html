<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組合ニュース｜マルキョウユニオン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", "Hiragino Kaku Gothic ProN",
                         "Yu Gothic", sans-serif;
            color: #222;
        }

        .page {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .union-name {
            font-size: 13px;
            font-weight: 600;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .guide {
            margin: 0;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .news-card {
            width: 100%;
            border: none;
            background: #ffffff;
            border-radius: 14px;
            padding: 18px 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            -webkit-tap-highlight-color: transparent;
        }

        .news-card:active {
            transform: scale(0.99);
            background: #f8f8f8;
        }

        .pdf-icon {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 10px;
            background: #eef5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            margin-right: 14px;
        }

        .news-info {
            flex: 1;
        }

        .month {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin-bottom: 4px;
        }

        .description {
            display: block;
            font-size: 13px;
            color: #777;
        }

        .arrow {
            font-size: 24px;
            color: #999;
            margin-left: 10px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="header">
        <div class="union-name">
            マルキョウユニオン
        </div>

        <div class="title">
            📰 組合ニュース
        </div>

        <p class="guide">
            組合からのお知らせをご覧いただけます<br>
            見たい月を選んでください
        </p>
    </div>


    {% for news in news_items %}

    <a class="news-card"
       href="{% url 'signed_pdf' news.pdf_filename %}?token={{ news.token|urlencode }}">

        <span class="pdf-icon">📄</span>

        <span class="news-info">
            <span class="month">{{ news.title }}</span>
            {% if news.content %}
            <span class="description">{{ news.content|linebreaksbr }}</span>
            {% endif %}
        </span>

        <span class="arrow">›</span>
    </a>

    {% empty %}

    <p style="text-align:center; color:#777;">
        現在、組合ニュースはありません。
    </p>

    {% endfor %}


    <div class="footer">
        MARUKYO UNION
    </div>

</div>

</body>
</html>
