<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>登録者一覧</title>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    text-align:center;
    color:#1976d2;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#1976d2;
    color:white;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#43a047;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.back:hover{
    background:#2e7d32;
}

</style>

</head>

<body>

<h1>登録者一覧</h1>

<table>

<tr>
    <th>No</th>
    <th>名前</th>
    <th>地域</th>
    <th>LINE ID</th>
    <th>登録日</th>
</tr>

{% for user in users %}

<tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.region }}</td>
    <td>{{ user.user_id }}</td>
    <td>{{ user.created_at|date:"Y-m-d H:i" }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="5">
        登録者はいません
    </td>
</tr>

{% endfor %}

</table>

<br>

<a href="{% url 'home' %}" class="back">
ホームへ戻る
</a>

</body>
</html>
